<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Generated MCQs</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background-color: #0f172a;
            font-family: "Segoe UI", Arial, sans-serif;
            padding: 40px 20px;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 0 auto;
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        h1 {
            color: #f8fafc;
            text-align: center;
            font-size: 32px;
            margin-bottom: 30px;
        }

        .result {
            background-color: #0f172a;
            color: #e2e8f0;
            padding: 25px;
            border-radius: 10px;
            border-left: 5px solid #38bdf8;
            margin-bottom: 30px;
            line-height: 1.8;
            font-size: 16px;

            /* Keeps Gemini's line breaks and spacing */
            white-space: pre-wrap;

            overflow-wrap: break-word;
        }

        .download-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        .download-btn {
            display: inline-block;
            min-width: 180px;
            padding: 14px 25px;
            color: white;
            text-decoration: none;
            text-align: center;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease,
                        box-shadow 0.2s ease,
                        background-color 0.2s ease;
        }

        .txt-btn {
            background-color: #0ea5e9;
        }

        .txt-btn:hover {
            background-color: #0284c7;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(14, 165, 233, 0.3);
        }

        .pdf-btn {
            background-color: #22c55e;
        }

        .pdf-btn:hover {
            background-color: #16a34a;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(34, 197, 94, 0.3);
        }

        .download-btn:active {
            transform: translateY(0);
        }

        @media (max-width: 600px) {
            .container {
                width: 100%;
                padding: 25px 20px;
            }

            h1 {
                font-size: 25px;
            }

            .download-buttons {
                flex-direction: column;
            }

            .download-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Generated Research Summary & MCQs</h1>

        <!-- Display Gemini-generated content -->
        <div class="result">{{ mcqs }}</div>

        <div class="download-buttons">

            <a href="/download/{{ txt_filename }}"
               class="download-btn txt-btn">
                Download as TXT
            </a>

            <a href="/download/{{ pdf_filename }}"
               class="download-btn pdf-btn">
                Download as PDF
            </a>

        </div>

    </div>

</body>

</html>
