<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">

    </head>
    <style>
      * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    background-color: white;
    width: 90%;
    max-width: 600px;
    padding: 40px;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
}

h1 {
    text-align: center;
    color: #333;
    margin-bottom: 30px;
    font-size: 28px;
}

.form-group {
    margin-bottom: 25px;
}

label {
    display: block;
    margin-bottom: 10px;
    font-size: 16px;
    font-weight: bold;
    color: #444;
}

input[type="file"],
input[type="number"] {
    width: 100%;
    padding: 12px;
    border: 2px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
    background-color: #f9f9f9;
    outline: none;
    transition: border-color 0.3s ease;
}

input[type="file"]:focus,
input[type="number"]:focus {
    border-color: #667eea;
}

button {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
}

button:active {
    transform: translateY(0);
}
    </style>
    <body>
    <div class = "container">
        <h1>MCQs from Uploaded Research paper</h1>
        <form action = "/generate" method = "post" enctype ="multipart/form-data">
            <div class = "form-group">
                <label for ="file">Upload your document(PDF,TXT,DOCX)</label>
                <input type = "file" name = "file" required >
            </div>
            <div class="form-group">
                <label for = "num_questions">How many questions do you want?</label>
                <input type = "number" name = "num_questions" min ="1" required>
            </div>

            <button type="submit"> Generate MCQ </button>
        </form>
    </div>
        
        <script src="" async defer></script>
    </body>
</html>
